# Weekly rank + AI-visibility tracking.
#
# Answers one question you cannot answer from the codebase: is any of this
# working? Checks a fixed panel of target queries in search, and separately
# checks whether TrueCap is discoverable as a recommended tool in the kind of
# content AI assistants draw on (listicles, aggregators, forum threads).
#
# The AI half matters as much as the SERP half here. The 2026-08-02 baseline
# found TrueCap had ZERO third-party mentions anywhere — no listicle, no
# aggregator, no Reddit thread — while smaller and newer competitors were
# already listed on the AlternativeTo DealCheck page. Assistants recommend
# what independent sources corroborate, so off-domain mentions are a tracked
# metric, not a nice-to-have.
#
# Output is a dated markdown file committed to docs/seo/visibility/ so the
# trend is readable in git history, plus a PR so a bad week is visible rather
# than silently landing on main.

name: SEO visibility

on:
  schedule:
    # Monthly, 1st at 15:00 UTC. Was weekly; moved for two reasons.
    #
    # The first run's own report made the case: search indexes do not move in
    # hours, and it flagged that a same-day re-run showed a page-one result
    # disappearing purely as result-set volatility rather than a real drop.
    # Weekly snapshots of a slow-moving signal mostly record noise, and noise
    # in a trend file is worse than no entry — it invites acting on nothing.
    #
    # The second reason is cost. This job is ~$1-3 per run; monthly is ~4x
    # cheaper than weekly for a signal that changes on a monthly timescale.
    - cron: "0 15 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: seo-visibility
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-haiku-4-5
            --max-turns 30
            --allowedTools "Read,Write,Glob,Grep,WebSearch,WebFetch,Bash(git:*),Bash(gh pr:*)"
          prompt: |
            Produce this week's SEO visibility snapshot for TrueCap
            (https://usetruecap.com) — a free rental-property investment
            analyzer (cap rate, cash flow, DSCR, cash-on-cash, BRRRR,
            house hacking). Repo: ${{ github.repository }}.

            ## First, read the previous snapshot
            List `docs/seo/visibility/` and read the most recent file. Your job
            is a DIFF against it, not a fresh report. If the directory is empty,
            read `docs/seo/2026-08-02-baseline.md` — that is the baseline.

            ## Part A — the tracked query panel
            WebSearch each of these and record whether a usetruecap.com URL
            appears, which URL, and the top 3 domains that do rank:

            - free rental property calculator
            - rental property cash flow calculator
            - cap rate calculator
            - DSCR calculator rental property
            - house hacking calculator
            - BRRRR calculator
            - best rental property analysis tool 2026
            - DealCheck alternative
            - how to calculate cap rate
            - what is a good DSCR for a rental property

            Keep this panel FIXED week to week. Changing the queries makes the
            trend meaningless. If you think the panel needs a new query, add it
            in a clearly marked "new this week" section and leave the ten alone.

            ## Part B — off-domain mentions
            Search for `usetruecap`, `"TrueCap" rental calculator`, and
            TrueCap on Reddit / listicles / aggregators (AlternativeTo, G2,
            Software Advice, Capterra, "best rental property calculator"
            roundups). List every third-party page that mentions TrueCap, with
            its URL. If there are none, say exactly that — do not pad the
            section with near-misses or brand-collision hits (truecapcre.com,
            true-cap.com, truecap.io and TrueCap Advisory are DIFFERENT
            companies; note them only if they are actively outranking the real
            site on a brand query).

            ## Part C — what changed
            Against the previous snapshot: new rankings gained, rankings lost,
            new mentions, new competitors appearing. If nothing moved, say
            nothing moved. A flat week reported honestly is more useful than a
            flat week dressed up.

            ## Part D — this week's single highest-leverage action
            Exactly one recommendation, specific enough to act on today, chosen
            on evidence from THIS run. Not a list. Not "keep publishing content".

            KNOWN NON-FIXES — do not recommend these, they have each been
            proposed and are settled:
            - Any `proxy.ts` change, 308 redirect, `X-Robots-Tag` or middleware
              tweak aimed at `truecap-iota.vercel.app`. That host is a DIFFERENT
              Vercel project and never executes this repo's code. The only fix
              is Morgan deleting that project. Read
              `docs/seo/foreign-deployment-truecap-iota.md` before writing Part D
              and do not re-litigate it. You may state that it is still live.
            - "Publish more blog posts." 75 posts rank for 0 of 10 panel
              queries; volume is the disproven lever here.
            - Google Indexing API submission. It is JobPosting/BroadcastEvent
              only and this site has no eligible content.

            ## Part E — keep the submission packets current
            Referring domains are the one input Google demands that this site
            has zero of, and it is the one thing no unattended machine can
            ethically supply — someone has to create accounts and fill in forms
            as themselves. So your job is to make that as close to copy-paste as
            possible.

            Maintain `docs/seo/submissions/` — one markdown file per target,
            each a packet Morgan can paste without thinking:

            - `alternativeto.md` — AlternativeTo, submitted against its
              **DealCheck** page (that page is already page one for "DealCheck
              alternative", a query 40 in-house /vs pages have failed to touch).
            - `saashub.md`, `slashdot.md`, `producthunt.md`, `g2-capterra.md`
            - `roundups.md` — the "best rental property calculator" roundups and
              tool directories that surfaced in THIS run's searches, each with
              its URL, whether it accepts submissions, and how.

            Each packet contains: the exact submission URL, the category to pick,
            a 1-line pitch, a ~50-word short description, a ~150-word long
            description, the tagline, pricing stated as **Free tier + Pro
            $29.99/mo or $300/yr** (never invent or round pricing — check
            `/pricing` if unsure), the logo/screenshot paths from `public/`, and
            a plain-English "what to click" list.

            Refresh a packet only when something changed — a new target, a dead
            link, changed submission rules. Say at the top of each file when it
            was last verified and against what.

            **You never submit anything.** No account creation, no form
            submission, no outreach email, no posting to Reddit or any forum.
            Drafts in `docs/seo/submissions/` only. Morgan executes them under
            his own identity. This boundary is not negotiable — automated
            submission is spam, and it would put the brand at risk for a handful
            of links.

            ## Write it
            Save to `docs/seo/visibility/<YYYY-MM-DD>.md` using today's real
            date. Front the file with a small summary table (queries ranking:
            N/10 · off-domain mentions: N · change vs last week).

            Commit any Part E packet changes in the SAME branch.

            Then: branch `seo/visibility-<YYYY-MM-DD>`, commit, and open a PR
            titled `seo: visibility snapshot <YYYY-MM-DD>` whose body is Part C
            and Part D inline, so the whole point is readable without opening
            the file. If any submission packet is new or changed, list it in the
            PR body under "Ready to submit" — that list is Morgan's to-do.

            You may only write under `docs/**`. The `build-chain-guard` CI job
            enforces this for every non-owner commit and will fail the PR
            otherwise; do not reach for a file outside it.

            ## Rules
            - Cite a URL for every claim about a third-party page. If you did not
              fetch it, do not assert it.
            - A WebSearch result set is a proxy for page one, not a rank-tracker
              reading. Say "not present in results" — never invent a position number.
            - Report losses as plainly as gains.
