# Automated SEO maintenance — twice a week, driven by Search Console data.
#
# WHAT CHANGED, 2026-08-03, AND WHY
# ---------------------------------
# This job used to write two NET-NEW blog posts a week. That was measured and
# it does not work for this site:
#
#   · 75 published posts rank for 0 of 10 target queries.
#   · Roughly 2% of the site's 429 URLs are indexed at all.
#   · The counterfactual already ran — 69 posts existed before this job was
#     automated, with the same result. Post #78 into an index Google is not
#     reading has an expected marginal return of approximately zero.
#
# The diagnosed bottlenecks are indexation, internal links, and zero
# third-party links — none of which another post addresses. So the schedule,
# the cost envelope and the pipeline stay; the JOB changes. See
# docs/seo/AUTOMATION.md.
#
# The other forcing reason: docs/seo-content-backlog.md is down to its last
# couple of items, and this workflow's documented failure mode on an empty
# backlog is inventing topics — which is exactly how a site ends up with
# scaled, near-duplicate content, a real policy violation.
#
# PRIORITY ORDER (the run picks the highest one with work available):
#   P1 REFRESH   — pages GSC shows with impressions at position 11-30. Real
#                  demand, nearly ranking. The cheapest wins on the board.
#   P2 LINK DEBT — internal links to pages that need them. The blog is the
#                  only part of this site with meaningful inbound links, so
#                  it is the equity source; 68 of 69 posts sit under the
#                  repo's own linking standard.
#   P3 NEW POST  — ONLY when telemetry shows an impression cluster with no
#                  matching page. Never from a brainstormed backlog.
#
# WHAT MERGES BY ITSELF
# ---------------------
# An earlier version of this header claimed "NOTHING PUBLISHES ITSELF." That
# was false: SEO_AUTOMERGE has been on since the day this shipped, and a
# post has already reached production with no human read. Auto-merge is a
# deliberate founder decision and it STAYS ON — but it is now tiered:
#
#   · P1/P2 maintenance runs (bounded edits to pages that already exist,
#     ratchet-gated by the SEO guards) auto-merge exactly as before.
#   · A P3 net-new PAGE opens a PR and waits for you. One click, and only
#     for genuinely new URLs.
#
# The tier is carried in the PR title prefix and enforced in the auto-merge
# step at the bottom of this file.

name: SEO content

on:
  schedule:
    # Tuesday and Friday, 14:00 UTC (10:00 America/New_York in EDT).
    - cron: "0 14 * * 2,5"
  workflow_dispatch:
    inputs:
      topic:
        description: "Override the backlog and write this topic instead"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  # Never let Tuesday's and a manual run collide on the same branch space.
  group: seo-content
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-sonnet-5
            # Was 40. Every run since 2026-08-02 died on
            # "Reached maximum number of turns (40)" — 2026-08-04 and
            # 2026-08-07 both, on the old prompt AND the new one. A run that
            # exhausts its turns produces NOTHING, opens no PR, and still bills
            # the full model spend, twice a week. It also emails Morgan a
            # failure every time, which is how a real failure later gets
            # ignored.
            #
            # Two changes, together: this ceiling goes up, and the prompt below
            # now bounds the WORK per run (one page, one lane) instead of
            # bounding it by luck. A maintenance run that reads telemetry,
            # edits one post, runs tsc + vitest, and opens a PR is comfortably
            # inside 70; the old prompt's "write a 1,500-word post, verify every
            # internal link resolves, run the suite, fix what fails" was not
            # inside 40 and never had been — the two successes on 2026-08-02
            # were smaller jobs against a stocked backlog.
            --max-turns 70
            # gh is scoped to create/view/diff ONLY — NOT `gh pr merge`. The
            # tiered auto-merge below is the whole point: a P3 net-new page
            # opens a PR and waits for a human. `Bash(gh pr:*)` would have
            # included `gh pr merge --auto`, letting the agent queue its own
            # net-new PR for merge and walk straight past that gate. A
            # production audit caught it. Keep this list tight; widening it
            # back to `gh pr:*` re-opens the hole.
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(npm test),Bash(npx tsc:*),Bash(npx vitest:*),Bash(node scripts/seo/*),Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
          prompt: |
            You are writing one SEO blog post for TrueCap (https://usetruecap.com),
            a free rental-property investment analyzer. Repo: ${{ github.repository }}.

            ## Read these first, in this order
            1. `CLAUDE.md` — codebase conventions. Section 8 lists things you must
               never do autonomously. Respect it.
            2. `docs/seo-content-backlog.md` — the topic queue and the content rules.
            3. `docs/seo/AUTOMATION.md` — how this job fits with the guards.
            4. Two recent posts under `app/blog/` for structure. Pick ones whose
               `PUBLISHED_AT` is most recent. Match their file shape exactly:
               SLUG / TITLE / SERP_TITLE / DESCRIPTION / PUBLISHED_AT /
               MODIFIED_AT / READING_TIME_MIN consts, `export const metadata`,
               FAQS array, JSON-LD blocks, and an `opengraph-image.tsx` sibling.

            ## Scope — read this before you plan anything
            You have a hard turn ceiling. A run that hits it produces NOTHING:
            no PR, no partial credit, and the full model spend is billed anyway.
            Every run from 2026-08-04 onward died exactly that way. So:

            - **ONE lane per run, ONE page.** Refresh one page, or pay down link
              debt on one post, or write one new post. Never two. Never "while
              I'm here".
            - **Budget your reads.** Read only what you need for the lane you
              picked. Do not read every recent post to decide.
            - **Stop and ship at two-thirds.** If you are around turn 45 and not
              yet committing, stop adding and commit what is genuinely finished.
              A small correct PR beats an ambitious run that dies.
            - If a check fails and the fix is not obvious within a few turns,
              revert your change, open the PR as a DRAFT explaining what you hit,
              and stop. Do not grind on it until the ceiling kills the run.

            ## Pick the work — in this order, highest priority with work available
            ${{ inputs.topic && format('The operator has overridden the priority order. Write this net-new post: {0} — and follow the P3 rules below, including the PR title prefix.', inputs.topic) || 'Work the priority order below. Do NOT skip to P3 because it is more interesting.' }}

            Read `docs/seo/telemetry/latest.json` first — it is written by the
            weekly GSC scoreboard and is the ONLY legitimate source of demand
            evidence here. If that file does not exist yet, say so plainly in
            the PR body and work P2, which needs no telemetry.

            ### P1 — REFRESH what is nearly ranking
            From telemetry, take pages with impressions at average position
            11-30. These have proven demand and are one page short of the first
            page; nothing else on this list is that cheap. For the best
            candidate: read the page, find what the currently-ranking results
            answer that it does not, and fix that. Add internal links pointing
            AT the page from related posts. Update MODIFIED_AT. Do not rewrite
            a page that is already fine just to have made a change — if the gap
            is not real, say so and drop to P2.

            ### P2 — PAY DOWN INTERNAL-LINK DEBT  ← the default lane
            This is what most runs should do, and it needs no telemetry, so it
            is also the fallback when `latest.json` does not exist yet.

            Pick exactly ONE post that is under the docs/SEO-ROADMAP.md §8
            standard (the repo records 68 of 69 under it — `node
            scripts/seo/guard-baseline.mjs` tells you which, so use it rather
            than reading posts to find out). Bring that ONE post up to
            standard, then run `node scripts/seo/guard-baseline.mjs --write` to
            bank the progress so the ratchet cannot slip backwards. Stop there.
            Sixty-eight posts at one per run is nine months of useful work; you
            do not need to finish it today.
            Prefer links that a reader would actually click in context. A link
            block bolted to the bottom of a post is link-stuffing; it helps
            nothing and it reads as spam to both humans and Google.

            ### P3 — A NET-NEW POST, only on evidence
            Write one ONLY when telemetry shows a query cluster with real
            impressions and NO page that targets it (`queriesWithoutPage` in
            latest.json). Never invent a topic, and never take one from the
            backlog just because the backlog has an item left — the backlog was
            built from a 2026-07-15 audit and its remaining items have not been
            re-validated against current data.

            If P1 and P2 have no work and telemetry shows no gap, DO NOTHING
            and say so. A run that correctly does nothing is a good run. Open
            no PR rather than manufacturing work.

            Whatever you pick, WebSearch the target query first and confirm
            there is an angle TrueCap can own. If the SERP is entirely lender
            lead-gen or proprietary-data plays a calculator site cannot beat,
            record that honestly and move on.

            ## Non-negotiables for the post
            - **Worked numbers.** Real dollar figures carried through a real
              example. No "let's say your property generates some income".
            - **SERP_TITLE ≤ 50 characters.** The layout appends " | TrueCap"
              and the guard test enforces 60 rendered. Keep the longer editorial
              headline in TITLE for the h1.
            - **DESCRIPTION ≤ 165 characters**, and written as a real sentence,
              not a keyword list. Plain apostrophes and quotes — NEVER HTML
              entities like `&apos;` in metadata strings; it is not JSX there and
              Google renders the literal characters. There is a hard CI gate on this.
            - **Internal links, meeting the docs/SEO-ROADMAP.md §8 standard:**
              ≥3 `/glossary/*`, ≥1 `/markets/*`, ≥1 `/tools/*`, ≥2 sibling
              `/blog/*`. Every link must resolve — check the target exists.
              Use `lib/calculator-registry.ts` for tool slugs; do NOT hardcode a
              list. New posts are held to this outright, not ratcheted.
            - **FAQ section + FAQPage JSON-LD**, plus BlogPosting and
              BreadcrumbList like every other post.
            - Register the post wherever the existing ones are registered
              (`BLOG_POSTS`, `lib/blog-topics.ts` — put it in the right topic hub,
              and link back to that hub from the post body).
            - Add the `opengraph-image.tsx` sibling.
            - 1,500+ words of substance. Length is a byproduct of covering the
              question properly, not a target to pad toward.

            ## Voice
            Direct and numerate, addressed to an investor who can read a
            spreadsheet. State the trade-off rather than hedging. No "in today's
            fast-paced market", no "unlock the power of". Where TrueCap genuinely
            helps, say so once, concretely; this is a useful article that happens
            to be published by a tool company, not an ad.

            ## Before you open the PR
            Run, and fix anything that fails:
              npx tsc --noEmit
              npm test
            `npm test` includes lib/__tests__/seo-guards.test.ts. Do NOT edit
            docs/seo/guard-baseline.json to make a failure go away — the baseline
            records pre-existing debt and a new post must meet the standard on its
            own. If a guard fails on your post, the post is what's wrong.

            ## Ship it — THE PR TITLE PREFIX DECIDES WHETHER IT AUTO-MERGES
            This is load-bearing. The auto-merge step reads the title prefix:

            - **P1 or P2 (maintenance — editing pages that already exist)**
              Branch `seo/maintain-<short-slug>`, PR title
              `seo-maintenance: <what you did>`. This AUTO-MERGES once every
              required check passes. That is intended: these are bounded edits
              to existing pages, gated by tsc, the full test suite including
              the SEO guards, and the production build.

            - **P3 (a net-new page)** Branch `seo/post-<slug>`, PR title
              `content: <SERP_TITLE>`. This does NOT auto-merge. A brand-new
              URL gets one human read before it is public. Do not use the
              `seo-maintenance:` prefix for a new page to get it merged faster
              — that is the one thing here that would be genuinely dishonest.

            - You may not change paths outside `app/blog/**`,
              `lib/blog-topics.ts` and `docs/**`. The `build-chain-guard` CI job
              enforces this and will fail the PR. If the work seems to need a
              file outside those paths, stop and explain it in the PR body
              instead of reaching for it.

            - PR body states: which priority you worked and why, the evidence
              from telemetry that justified it (quote the numbers), what you
              changed, and anything you were unsure about. Be honest about
              weaknesses — a flagged soft spot gets fixed, a hidden one ships.
            - If you could not produce something you'd defend, open the PR as a
              DRAFT and say why. Do not pad to a word count.

      # A `content:` PR is the one tier that deliberately waits for Morgan.
      # Requesting a native GitHub review is stronger than relying on repository
      # watch settings: GitHub creates a direct review notification, and email
      # follows the reviewer's own notification preferences.
      - name: Request owner review for net-new content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=$(git branch --show-current)
          pr=$(gh pr list --head "$branch" --state open --json number,isDraft,title,url --jq '.[0] // empty')
          if [ -z "$pr" ]; then
            echo "No open PR for $branch — no approval notification needed."
            exit 0
          fi

          number=$(echo "$pr" | jq -r .number)
          title=$(echo "$pr" | jq -r .title)
          if [[ "$title" != "content: "* ]]; then
            echo "PR #$number is not net-new content — routine maintenance remains autonomous."
            exit 0
          fi

          echo "Requesting owner review for net-new content PR #$number."
          gh pr edit "$number" --add-reviewer "$GITHUB_REPOSITORY_OWNER"
          echo "Approval notification sent: $(echo "$pr" | jq -r .url)"

      # ---------------------------------------------------------------
      # TIERED AUTO-MERGE. Requires BOTH:
      #   - Settings → General → Pull Requests → "Allow auto-merge" ticked
      #   - Settings → Secrets and variables → Actions → Variables tab →
      #     SEO_AUTOMERGE = true   (a VARIABLE, not a secret)
      #
      # This never merges immediately. It queues the PR to merge once every
      # REQUIRED check passes — `build-chain-guard` and `check` (tsc, the full
      # test suite including the SEO guards, and the production build). Those
      # are required on main via branch protection, applied 2026-08-03; before
      # that they were required on nothing and a PR merged 19 SECONDS after CI
      # started, which is the incident this tiering answers.
      #
      # THE TIER:
      #   `seo-maintenance:` → queued. Bounded edits to pages that already
      #                        exist, ratchet-gated by the SEO guards.
      #   `content:`         → NOT queued. A net-new public URL waits for
      #                        Morgan. One click, only for genuinely new pages.
      #   anything else      → NOT queued, and says so loudly. An unrecognised
      #                        prefix means the run did something this file
      #                        does not model; failing closed is the only safe
      #                        reading of that.
      #
      # Drafts are skipped at every tier: the prompt opens a draft when the run
      # is not confident, and that signal must not be merged past you.
      - name: Queue the PR to auto-merge once checks pass
        if: vars.SEO_AUTOMERGE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          branch=$(git branch --show-current)
          pr=$(gh pr list --head "$branch" --state open --json number,isDraft,title --jq '.[0] // empty')
          if [ -z "$pr" ]; then
            echo "No open PR for $branch — the run may have correctly decided there was nothing to do. Nothing to queue."
            exit 0
          fi
          number=$(echo "$pr" | jq -r .number)
          title=$(echo "$pr" | jq -r .title)

          if [ "$(echo "$pr" | jq -r .isDraft)" = "true" ]; then
            echo "PR #$number is a draft — the run flagged low confidence. Leaving it for review."
            exit 0
          fi

          # Case-sensitive on purpose. The prefix is a machine contract, not
          # prose, and a loose match is how "Content: ..." would slip into the
          # maintenance tier.
          case "$title" in
            "seo-maintenance: "*)
              echo "Maintenance PR #$number — queueing auto-merge after required checks."
              gh pr merge "$number" --auto --squash
              ;;
            "content: "*)
              echo "PR #$number is a NET-NEW page (\"$title\")."
              echo "Not auto-merging: a brand-new public URL gets one human read."
              echo "Review and merge it yourself: $(gh pr view "$number" --json url --jq .url)"
              ;;
            *)
              echo "PR #$number has an unrecognised title prefix: \"$title\""
              echo "Expected 'seo-maintenance: ' or 'content: '. Not auto-merging."
              echo "This means the run did something this workflow does not model — read the diff."
              ;;
          esac
